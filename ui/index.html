<!DOCTYPE html>
<html lang="en" data-theme="dark" data-appearance="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Yacine TV</title>
  <link rel="icon" type="image/png" href="/AppBrand-Default.png" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/hls.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Clean Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <div class="brand-wrap">
          <img src="/AppBrand-Dark.png" alt="Yacine TV" class="brand-logo" id="brand-logo" width="32" height="32" />
          <span class="brand-title">Yacine TV</span>
        </div>
        <button class="icon-btn" id="sidebar-toggle-btn" type="button" title="Toggle Sidebar" aria-label="Toggle Sidebar">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" />
            <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" />
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="nav-item active" data-nav="events" id="nav-events" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="10" cy="10" r="6.8" />
              <circle cx="10" cy="10" r="2.2" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span class="nav-label">Today's Matches</span>
          <span class="nav-count" id="events-count"></span>
        </button>

        <button class="nav-item" data-nav="favorites" id="nav-favorites" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
              <path d="M10 2.7l2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" />
            </svg>
          </span>
          <span class="nav-label">Favorites</span>
          <span class="nav-count" id="fav-count"></span>
        </button>

        <div class="nav-section-divider">CHANNELS</div>
        <div id="category-list" class="category-list"></div>
      </nav>

      <div class="sidebar-footer">
        <div class="appearance-segmented" id="appearance-segmented" role="radiogroup" aria-label="Appearance Theme">
          <button class="seg-btn active" type="button" data-appearance="auto" role="radio" aria-checked="true" title="Follow System Theme">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <circle cx="8" cy="8" r="5.5" />
              <path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor" stroke="none" />
            </svg>
            <span>Auto</span>
          </button>
          <button class="seg-btn" type="button" data-appearance="light" role="radio" aria-checked="false" title="Light Mode">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <circle cx="8" cy="8" r="2.7" />
              <path d="M8 1.8v1.4M8 12.8v1.4M1.8 8h1.4M12.8 8h1.4M3.6 3.6l1 1M11.4 11.4l1 1M12.4 3.6l-1 1M4.6 11.4l-1 1" />
            </svg>
            <span>Light</span>
          </button>
          <button class="seg-btn" type="button" data-appearance="dark" role="radio" aria-checked="false" title="Dark Mode">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
              <path d="M12.8 10.1A5.4 5.4 0 0 1 5.9 3.2a5.5 5.5 0 1 0 6.9 6.9z" />
            </svg>
            <span>Dark</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Column -->
    <main class="main-workspace" id="main-workspace">
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="icon-btn hidden" id="sidebar-open-btn" type="button" title="Show Sidebar" aria-label="Show Sidebar">
            <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" />
              <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" />
            </svg>
          </button>
          <button id="back-nav-btn" class="pill-back-btn hidden" type="button">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 3.5L5.5 8l4.5 4.5" />
            </svg>
            <span>Back</span>
          </button>
          <div class="view-heading-wrap">
            <h1 class="view-title" id="view-title">Today's Matches</h1>
            <span class="view-subtitle" id="view-subtitle"></span>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="search-box" id="search-box">
            <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <circle cx="7" cy="7" r="4.8" />
              <path d="M10.8 10.8L14 14" />
            </svg>
            <input type="search" id="search-input" placeholder="Search channels…" aria-label="Search channels" autocomplete="off" />
            <button id="search-clear-btn" class="search-clear-btn hidden" type="button" aria-label="Clear search">×</button>
          </div>

          <button id="theater-btn" class="circle-action-btn hidden" type="button" title="Toggle Theater Mode" aria-label="Toggle Theater Mode">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.2" y="4.5" width="15.6" height="11" rx="2" />
              <path d="M5.5 8h9v4h-9z" fill="currentColor" stroke="none" opacity="0.28" />
            </svg>
          </button>

          <button id="refresh-btn" class="circle-action-btn" type="button" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16.2 8.2A6.5 6.5 0 0 0 4.8 6.4M3.8 11.8a6.5 6.5 0 0 0 11.4 1.8" />
              <path d="M16.5 4.2v4h-4M3.5 15.8v-4h4" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Inline Error Banner -->
      <div id="inline-error-banner" class="inline-error-banner hidden" role="alert">
        <span id="inline-error-text">Unable to reach stream API.</span>
        <button id="inline-error-retry" class="inline-retry-btn" type="button">Retry</button>
      </div>

      <!-- Docked Player (Revealed only when streaming) -->
      <section class="player-dock hidden" id="player-dock">
        <div class="video-stage-wrapper">
          <div class="video-stage" id="video-stage" tabindex="0">
            <video id="hls-video" playsinline autoplay></video>
            <canvas id="rcas-canvas" class="rcas-canvas hidden" aria-hidden="true"></canvas>

            <div class="player-hud" id="player-hud">
              <div class="hud-top">
                <div class="hud-title-badge hidden" id="hud-fs-title">
                  <span class="live-indicator small">LIVE</span>
                  <span id="hud-fs-title-text">Channel</span>
                </div>
                <div class="hud-top-right">
                  <button id="fs-quality-btn" class="hud-btn hidden" type="button" title="Stream Quality & Servers">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                      <circle cx="8" cy="8" r="2.2" />
                      <path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" />
                    </svg>
                    <span id="fs-quality-btn-label">Auto</span>
                  </button>
                </div>
              </div>

              <div id="fs-popover" class="fs-popover hidden">
                <div class="fs-popover-section" id="fs-servers-section">
                  <div class="control-label">SERVERS</div>
                  <div id="fs-server-pills" class="pill-row"></div>
                </div>
                <div class="fs-popover-section hidden" id="fs-quality-section">
                  <div class="control-label">QUALITY</div>
                  <div id="fs-quality-pills" class="pill-row"></div>
                </div>
                <div class="fs-popover-section">
                  <div class="control-label">GPU UPSCALE</div>
                  <div id="fs-enhance-pills" class="pill-row"></div>
                </div>
                <div class="fs-popover-section">
                  <div class="control-label">ASPECT RATIO</div>
                  <div id="fs-aspect-pills" class="pill-row"></div>
                </div>
              </div>

              <div class="hud-bottom" id="hud-bottom">
                <div class="hud-left">
                  <button id="play-pause-btn" class="hud-btn icon-only" type="button" title="Play / Pause" aria-label="Play / Pause">
                    <svg id="icon-pause" viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">
                      <rect x="3.5" y="2.8" width="3" height="10.4" rx="1" />
                      <rect x="9.5" y="2.8" width="3" height="10.4" rx="1" />
                    </svg>
                    <svg id="icon-play" class="hidden" viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">
                      <path d="M4.2 2.8a.7.7 0 0 1 1.06-.6l8.2 5.2a.7.7 0 0 1 0 1.2l-8.2 5.2a.7.7 0 0 1-1.06-.6V2.8z" />
                    </svg>
                  </button>

                  <button id="mute-btn" class="hud-btn icon-only" type="button" title="Mute / Unmute" aria-label="Mute / Unmute">
                    <svg id="icon-vol-on" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2.5 6.2h2.6l3.4-2.8v9.2L5.1 9.8H2.5z" fill="currentColor" stroke="none" />
                      <path d="M10.8 5.5a3.5 3.5 0 0 1 0 5M12.6 3.7a6 6 0 0 1 0 8.6" stroke-linecap="round" />
                    </svg>
                    <svg id="icon-vol-off" class="hidden" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                      <path d="M2.5 6.2h2.6l3.4-2.8v9.2L5.1 9.8H2.5z" fill="currentColor" stroke="none" />
                      <path d="M11 6l3 4M14 6l-3 4" />
                    </svg>
                  </button>

                  <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
                </div>

                <div class="hud-right">
                  <button id="pip-btn" class="hud-btn icon-only" type="button" title="Picture-in-Picture" aria-label="Picture-in-Picture">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
                      <rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.8" />
                      <rect x="7.5" y="7.2" width="5.2" height="4.2" rx="1" fill="currentColor" stroke="none" />
                    </svg>
                  </button>
                  <button id="fullscreen-btn" class="hud-btn icon-only" type="button" title="Toggle Fullscreen (F11)" aria-label="Toggle Fullscreen">
                    <svg id="icon-fs-enter" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" />
                    </svg>
                    <svg id="icon-fs-exit" class="hidden" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M6 2.5V6H2.5M10 6V2.5M10 6h3.5M10 13.5V10h3.5M6 13.5V10H2.5" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <div id="player-loading" class="player-loading-overlay hidden">
              <div class="spinner"></div>
              <div class="loading-text" id="loading-text">Connecting…</div>
            </div>
          </div>
        </div>

        <!-- Stream Metadata & Controls -->
        <div class="player-info-panel" id="player-info-panel">
          <div class="now-playing-top">
            <div class="now-playing-header">
              <span class="live-indicator" id="live-indicator">LIVE</span>
              <h2 class="now-playing-title" id="now-playing-title"></h2>
            </div>
            <button id="close-player-btn" class="icon-btn" type="button" title="Stop & Close Player" aria-label="Stop and close player">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="M3.5 3.5l9 9M12.5 3.5l-9 9" />
              </svg>
            </button>
          </div>

          <div class="now-playing-meta" id="now-playing-meta"></div>

          <div class="control-group hidden" id="servers-group">
            <span class="control-label">SERVERS</span>
            <div class="pill-row" id="server-pills"></div>
          </div>

          <div class="control-group hidden" id="quality-group">
            <span class="control-label">QUALITY</span>
            <div class="pill-row" id="quality-pills"></div>
          </div>

          <div class="control-group" id="aspect-group">
            <span class="control-label">ASPECT RATIO</span>
            <div class="pill-row" id="aspect-pills">
              <button class="ctrl-pill active" type="button" data-aspect="fit">16:9 Fit</button>
              <button class="ctrl-pill" type="button" data-aspect="fill">Widescreen Fill</button>
              <button class="ctrl-pill" type="button" data-aspect="stretch">Stretch</button>
            </div>
          </div>

          <div class="control-group" id="enhance-group">
            <span class="control-label">GPU UPSCALE</span>
            <div class="pill-row" id="enhance-pills">
              <button class="ctrl-pill" type="button" data-enhance="off">Off</button>
              <button class="ctrl-pill active" type="button" data-enhance="auto_sd">Auto (&lt; 720p)</button>
              <button class="ctrl-pill" type="button" data-enhance="on">Always On</button>
            </div>
          </div>

          <div class="stream-stats" id="stream-stats">
            <span class="stat-item hidden" id="stat-res-wrap">
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                <rect x="2" y="3" width="12" height="9" rx="1.5" />
                <path d="M5.5 14h5" stroke-linecap="round" />
              </svg>
              <span id="stat-res"></span>
            </span>
            <span class="stat-item hidden" id="stat-bitrate-wrap">
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1.5 8h2.6l1.7-4 2.4 8 2-5 1.3 1h3" />
              </svg>
              <span id="stat-bitrate"></span>
            </span>
            <span class="stat-item hidden" id="stat-mode-wrap">
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
                <rect x="2.2" y="2.2" width="11.6" height="11.6" rx="2" />
                <path d="M5.5 10.5l2.3-2.3 1.7 1.7 2-2.5" stroke-linecap="round" />
              </svg>
              <span id="stat-mode"></span>
            </span>
          </div>
        </div>
      </section>

      <!-- Scrollable Content Grid -->
      <section class="content-browser" id="content-browser">
        <div id="content-grid" class="cards-grid"></div>
      </section>
    </main>
  </div>
</body>
</html>
